[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dominion"
version = "0.3.1"
description = "DOMINION: tessellation of object domains from 2D immunofluorescence images."
requires-python = ">=3.10"
authors = [{ name = "Garrick Salois" }]
license = { text = "MIT" }
readme = "README.md"
# Core ("Basic") dependencies — no TensorFlow, no GPU. These alone give the
# default signal-mode pipeline and run on essentially any machine.
dependencies = [
    "numpy",
    "scikit-image",
    "tifffile",
    "napari[all]",
    "pyqtgraph",
    "magicgui",
    "qtpy",
    "skan",
    "networkx",
]

[project.optional-dependencies]
# The "Full" extra: StarDist nuclei segmentation (nuclei mode). Pulls in
# TensorFlow, which on native Windows is pinned to 2.10 for GPU/CUDA support
# (see README). Install with: pip install "dominion[nuclei]"
nuclei = [
    "stardist",
    "csbdeep",
    "tensorflow",
]

[project.urls]
Repository = "https://github.com/GSNautilus/Dominion"

[project.scripts]
dominion = "dominion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
